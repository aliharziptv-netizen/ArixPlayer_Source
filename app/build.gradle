plugins { id 'com.android.application' }

android {
    namespace 'com.arix.player'
    compileSdk 36
    signingConfigs { release {
        def ks = System.getenv('ANDROID_KEYSTORE_PATH')
        if (ks != null) { storeFile file(ks); storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD'); keyAlias System.getenv('ANDROID_KEY_ALIAS'); keyPassword System.getenv('ANDROID_KEY_PASSWORD') }
    } }
    buildTypes { release { if (System.getenv('ANDROID_KEYSTORE_PATH') != null) signingConfig signingConfigs.release; minifyEnabled false } }
    defaultConfig {
        applicationId 'com.arix.player'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '2.7'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.0.2'
    implementation 'androidx.media3:media3-exoplayer-dash:1.0.2'
    implementation 'androidx.media3:media3-exoplayer-hls:1.0.2'
    implementation 'androidx.media3:media3-ui:1.0.2'
    implementation 'androidx.media3:media3-datasource:1.0.2'

    implementation 'com.google.android.gms:play-services-ads:20.1.0'
    implementation 'com.google.firebase:firebase-analytics:18.0.3'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'com.airbnb.android:lottie:3.7.0'
}

// The decoded APK carries merged AndroidX/Material attributes. Strip only
// definitions also supplied by resolved AARs before AAPT merges resources.
def normalizeBundledDependencyAttrs = tasks.register('normalizeBundledDependencyAttrs') {
    doLast {
        def sourceAttrs = file('../reference/original-res/values/attrs.xml')
        def appAttrs = file('src/main/res/values/attrs.xml')
        if (!sourceAttrs.isFile()) {
            throw new GradleException("Missing original merged attr source: ${sourceAttrs}")
        }
        def dependencyAttrs = new LinkedHashSet<String>()
        configurations.getByName('debugRuntimeClasspath').files
            .findAll { it.name.endsWith('.aar') }
            .each { aar ->
                def zip = new java.util.zip.ZipFile(aar)
                try {
                    zip.entries().each { entry ->
                        if (!entry.directory && entry.name.startsWith('res/values') && entry.name.endsWith('.xml')) {
                            def text = zip.getInputStream(entry).getText('UTF-8')
                            def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                            factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
                            factory.setExpandEntityReferences(false)
                            def document = factory.newDocumentBuilder().parse(
                                new ByteArrayInputStream(text.getBytes('UTF-8'))
                            )
                            def attrs = document.getElementsByTagName('attr')
                            for (int i = 0; i < attrs.length; i++) {
                                def attr = attrs.item(i)
                                def isRootResource = attr.parentNode == document.documentElement
                                def hasDefinition = attr.hasAttribute('format') || attr.getElementsByTagName('enum').length > 0 || attr.getElementsByTagName('flag').length > 0
                                if (isRootResource || hasDefinition) dependencyAttrs.add(attr.getAttribute('name'))
                            }
                        }
                    }
                } finally {
                    zip.close()
                }
            }
        def text = sourceAttrs.getText('UTF-8')
        int removedDefinitions = 0
        dependencyAttrs.each { name ->
            if (name == 'themeLineHeight') return
            def quoted = java.util.regex.Pattern.quote(name)
            def pattern = java.util.regex.Pattern.compile(
                '(?ms)^    <attr name="' + quoted + '"[^>]*?(?:/>|>.*?^    </attr>)\\R'
            )
            def matcher = pattern.matcher(text)
            if (matcher.find()) {
                removedDefinitions++
                text = matcher.replaceAll('')
            }
        }
        appAttrs.setText(text, 'UTF-8')
        logger.lifecycle("Normalized merged Android attrs: ${removedDefinitions} duplicate definitions removed from ${dependencyAttrs.size()} AAR attr names")
    }
}
tasks.named('preBuild').configure {
    dependsOn(normalizeBundledDependencyAttrs)
}
